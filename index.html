<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue sur la page de jeux</title>
    <style>
        /* --- ARRIÈRE-PLAN STYLÉ --- */
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            animation: float 12s infinite ease-in-out alternate;
        }

        body::before {
            width: 450px;
            height: 450px;
            background: rgba(144, 30, 80, 0.45);
            top: 5%;
            left: 10%;
        }

        body::after {
            width: 550px;
            height: 550px;
            background: rgba(29, 78, 216, 0.4);
            bottom: 5%;
            right: 10%;
            animation-delay: -6s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(40px, -40px) scale(1.2);
            }
        }

        /* --- LE SUPER TITRE --- */
        .page-title {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            margin: 0 0 50px 0;
            letter-spacing: 3px;

            background: linear-gradient(45deg, #ff007f, #00d4ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;

            filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.4));
            z-index: 1;
        }

        /* --- GALERIE FLEXBOX --- */
        .flex-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 60px;
            justify-content: center;
            align-items: center;
            max-width: 1200px;
            z-index: 1;
        }

        /* --- EFFET "GLASSMORPHISM" --- */
        .image-link {
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            border-radius: 24px;
            padding: 20px;

            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);

            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .image-link:hover {
            transform: translateY(-15px) scale(1.05);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                inset 0 0 20px rgba(255, 255, 255, 0.05);
        }

        /* --- LES IMAGES --- */
        .image-link img {
            display: block;
            max-width: 100%;
            max-height: 180px;
            border-radius: 12px;
            object-fit: contain;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.5));
            transition: filter 0.3s ease;
        }

        .image-link:hover img {
            filter: drop-shadow(0 8px 16px rgba(255, 255, 255, 0.15));
        }

        /* --- SECTION PUBS EN BAS DE PAGE (SANS OVERLAY / SANS BLOCAGE) --- */
        .ads-container {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            z-index: 1;
        }

        .ad-box {
            width: 100%;
            max-width: 468px;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            overflow: hidden; /* Empêche le script publicitaire de dépasser */
        }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }

            .page-title {
                font-size: 2rem;
                margin: 0 0 30px 0;
                letter-spacing: 1px;
            }

            .flex-gallery {
                flex-direction: column;
                gap: 25px;
                width: 100%;
            }

            .image-link {
                width: 90%;
                padding: 15px;
            }

            .image-link img {
                max-height: 130px;
            }

            .image-link:hover {
                transform: none;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid rgba(255, 255, 255, 0.08);
            }

            .ad-box {
                transform: scale(0.85); /* S'adapte parfaitement aux petits écrans */
            }
        }
    </style>
</head>

<body>

    <h1 class="page-title">Bienvenue sur la page de jeux</h1>

        </div>

    </div>

</body>

</html>
